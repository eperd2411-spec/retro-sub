<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RETRO SUB // YouTube Caption Terminal</title>
<style>
:root{--bg:#07100c;--panel:#0c1711;--line:#35ff8a;--text:#b9ffd2;--muted:#5fa77a;--amber:#ffd166;--red:#ff657a;--shadow:0 0 18px rgba(53,255,138,.15)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#10251a 0,#07100c 48%,#030806 100%);color:var(--text);font-family:"Courier New",monospace;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);mix-blend-mode:screen;opacity:.45}
.wrap{width:min(1050px,94vw);margin:28px auto 60px}.top{border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px;background:rgba(5,15,9,.9)}.brand{font-size:clamp(24px,4vw,42px);letter-spacing:5px;text-shadow:0 0 10px rgba(53,255,138,.5)}.sub{color:var(--muted);margin-top:6px}.status{float:right;color:var(--amber);font-size:12px}
.panel{border:1px solid #1d5f39;background:rgba(8,20,13,.92);padding:18px;margin-top:14px;box-shadow:var(--shadow)}label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.urlrow{display:flex;gap:10px}.urlrow input{flex:1}.input,button,select{font:inherit;border:1px solid #2d8f55;background:#06110a;color:var(--text);padding:12px}input:focus,select:focus{outline:1px solid var(--line);box-shadow:0 0 10px rgba(53,255,138,.2)}button{cursor:pointer;color:#07100c;background:var(--line);font-weight:bold}button:hover{filter:brightness(1.1)}button.secondary{background:#10251a;color:var(--text);border-color:#2d8f55}.grid{display:grid;grid-template-columns:170px 1fr;gap:18px}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid #276e45}.title{font-size:20px;color:#e6ffeF;margin-bottom:6px}.meta{color:var(--muted);font-size:13px}.tracks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.track{border:1px solid #276e45;padding:9px 11px;cursor:pointer;background:#08160d}.track.active{border-color:var(--amber);color:var(--amber);box-shadow:0 0 8px rgba(255,209,102,.12)}.tag{font-size:10px;color:var(--muted);display:block;margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.viewer{max-height:460px;overflow:auto;border:1px solid #1d5f39;background:#030906;padding:10px;margin-top:12px}.cue{padding:10px;border-bottom:1px dashed #16482c}.cue:hover{background:#0a1b10}.time{color:var(--amber);font-size:12px;cursor:pointer}.txt{margin-top:4px;white-space:pre-wrap}.msg{padding:12px;border:1px dashed var(--muted);color:var(--muted)}.err{border-color:var(--red);color:var(--red)}.hidden{display:none}.small{font-size:11px;color:var(--muted)}@media(max-width:650px){.urlrow{flex-direction:column}.grid{grid-template-columns:1fr}.thumb{max-width:420px}.status{float:none;display:block;margin-top:8px}}
</style></head>
<body><main class="wrap">
<header class="top"><span class="status">● SYSTEM READY</span><div class="brand">RETRO SUB</div><div class="sub">YOUTUBE // CAPTION EXTRACTION TERMINAL</div></header>
<section class="panel"><label>&gt; ENTER YOUTUBE URL</label><div class="urlrow"><input id="url" class="input" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"><button id="scan">[ SCAN CAPTIONS ]</button></div><div id="msg" class="msg hidden" style="margin-top:12px"></div></section>
<section id="video" class="panel hidden"><div class="grid"><img id="thumb" class="thumb"><div><div id="title" class="title"></div><div id="meta" class="meta"></div><div id="tracks" class="tracks"></div></div></div></section>
<section id="work" class="panel hidden"><div class="toolbar"><select id="fmt"><option value="srt">SRT</option><option value="vtt">VTT</option><option value="txt">TXT</option></select><button id="download">[ DOWNLOAD ]</button><button id="copy" class="secondary">[ COPY TEXT ]</button><input id="search" class="input" placeholder="search caption..." style="flex:1;min-width:180px"></div><div id="viewer" class="viewer"></div><div class="small" style="margin-top:9px">Click timestamp untuk membuka video pada posisi tersebut.</div></section>
<footer class="small" style="text-align:center;margin-top:20px">RETRO SUB // caption-only tool // use captions according to applicable rights</footer>
</main>
<script>
const $=s=>document.querySelector(s); let state={url:'',info:null,track:null,cues:[]};
function msg(t,err=false){const e=$('#msg');e.textContent=t;e.classList.remove('hidden');e.classList.toggle('err',err)}
function hideMsg(){$('#msg').classList.add('hidden')}
function fmtDur(s){if(!s)return '';s=Math.round(s);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map((v,i)=>i===0&&v===0?null:String(v).padStart(2,'0')).filter(v=>v!==null).join(':')}
function renderTracks(){const e=$('#tracks');e.innerHTML='';state.info.tracks.forEach((t,i)=>{const b=document.createElement('div');b.className='track'+(i===0?' active':'');b.innerHTML=`${t.lang.toUpperCase()}<span class="tag">${t.kind==='auto'?'AUTO-GENERATED':'MANUAL'} · ${t.name||''}</span>`;b.onclick=()=>selectTrack(t,b);e.appendChild(b);});if(state.info.tracks[0]) selectTrack(state.info.tracks[0],e.firstChild)}
function parseVtt(v){v=v.replace(/\r/g,'');const blocks=v.split(/\n\s*\n/);const out=[];for(const b of blocks){const lines=b.split('\n');const ti=lines.findIndex(x=>x.includes('-->'));if(ti<0)continue;let [a,z]=lines[ti].split('-->');a=a.trim();z=(z||'').trim().split(/\s+/)[0];const text=lines.slice(ti+1).join('\n').replace(/<[^>]+>/g,'').trim();if(text)out.push({a,z,text})}return out}
async function selectTrack(t,el){document.querySelectorAll('.track').forEach(x=>x.classList.remove('active'));el.classList.add('active');state.track=t;msg('LOADING CAPTION...');try{const r=await fetch('/api/caption',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:state.url,lang:t.lang,kind:t.kind,fmt:'vtt'})});if(!r.ok)throw new Error(await r.text());const v=await r.text();state.cues=parseVtt(v);renderViewer();hideMsg();$('#work').classList.remove('hidden')}catch(e){msg('ERROR: '+e.message,true)}}
function renderViewer(){const q=$('#search').value.toLowerCase();const v=$('#viewer');v.innerHTML='';state.cues.filter(c=>c.text.toLowerCase().includes(q)).forEach(c=>{const d=document.createElement('div');d.className='cue';d.innerHTML=`<div class="time">${c.a}</div><div class="txt"></div>`;d.querySelector('.txt').textContent=c.text;d.querySelector('.time').onclick=()=>{const sec=c.a.split(':').reduce((a,x)=>a*60+parseFloat(x),0);window.open(state.info.webpage_url+'&t='+Math.floor(sec)+'s','_blank')};v.appendChild(d)})}
async function scan(){const url=$('#url').value.trim();if(!url)return msg('Masukkan URL YouTube.',true);state.url=url;$('#video').classList.add('hidden');$('#work').classList.add('hidden');msg('SCANNING YOUTUBE...');try{const r=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(!r.ok)throw new Error((await r.text()).replace(/^\{"detail":"?|'?\}?$/g,''));state.info=await r.json();$('#thumb').src=state.info.thumbnail||'';$('#title').textContent=state.info.title;$('#meta').textContent=[state.info.channel,fmtDur(state.info.duration)].filter(Boolean).join('  //  ');$('#video').classList.remove('hidden');renderTracks();hideMsg()}catch(e){msg('ERROR: '+e.message,true)}}
$('#scan').onclick=scan;$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});$('#search').oninput=renderViewer;
$('#copy').onclick=async()=>{await navigator.clipboard.writeText(state.cues.map(c=>c.text).join('\n\n'));msg('TRANSCRIPT COPIED.');setTimeout(hideMsg,1600)};
$('#download').onclick=async()=>{if(!state.track)return;const fmt=$('#fmt').value;msg('PREPARING '+fmt.toUpperCase()+'...');try{const r=await fetch('/api/caption',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:state.url,lang:state.track.lang,kind:state.track.kind,fmt})});if(!r.ok)throw new Error(await r.text());const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='retro-sub.'+fmt;a.click();URL.revokeObjectURL(a.href);msg('DOWNLOAD READY.');setTimeout(hideMsg,1600)}catch(e){msg('ERROR: '+e.message,true)}};
</script></body></html>
